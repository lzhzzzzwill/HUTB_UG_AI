function editCell(n){const p=[n%16,Math.floor(n/16)],sid=gridStart[1]*16+gridStart[0],tid=gridEnd[1]*16+gridEnd[0];if(tool==='start'||tool==='end'){if(n===(tool==='start'?tid:sid))return;walls.delete(n);terrain.delete(n);if(tool==='start')gridStart=p;else gridEnd=p;}else {if(n===sid||n===tid)return;const set=tool==='wall'?walls:terrain;set.has(n)?set.delete(n):set.add(n);(tool==='wall'?terrain:walls).delete(n);}setup();}
function play(){if(timer){stop();return;}if(frames.length<2)return;if(index===frames.length-1){index=0;render();}timer=setInterval(()=>{if(index<frames.length-1){index++;render();}else stop();},+$('speed').value);$('play').textContent='Ⅱ 暂停';}
$('play').onclick=play;$('prev').onclick=()=>{stop();if(index>0){index--;render();}};$('next').onclick=()=>{stop();if(index<frames.length-1){index++;render();}};$('reset').onclick=setup;$('finish').onclick=()=>{stop();index=frames.length-1;render();};$('scrub').oninput=e=>{stop();index=+e.target.value;render();};$('speed').onchange=()=>{if(timer){stop();play();}};$('tabs').innerHTML=modes.map(([name,sub],i)=>`<button data-mode="${i}">${String(i+1).padStart(2,'0')} ${name}<small>${sub}</small></button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{mode=+b.dataset.mode;setup();});document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','A','SUMMARY'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();play();}if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click();});window.addEventListener('resize',()=>{if(mode===0||mode===1)render();});defaultMap();setup();
